

services:
  # One-shot init job: apply migrations and seed data
  migrate-seed:
    build:
      context: .
      target: builder
    env_file:
      - .env
    command:
      [
        "sh",
        "-c",
        "export DATABASE_URL=\"$DATABASE_URL_DOCKER\" && npx prisma migrate deploy && npx prisma db seed",
      ]
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["dev", "ci"]

  # Knowledge Hub API
  app:
    image: localhost/nodejs-2026q1-knowledge-hub1_app:latest
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
        required: false
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 4000) + '/', (r) => { if (r.statusCode >= 400) process.exit(1); }).on('error', () => process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL database exposed on localhost:5440
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5440:5432"
    volumes:
      - khub1api_db-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: Adminer for database debugging (development only)
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["debug"]

networks:
  app-network:
    driver: bridge

volumes:
  khub1api_db-data:
  